<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1A4B9C"/>
      <stop offset="100%" stop-color="#2E9BE8"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD340"/>
      <stop offset="100%" stop-color="#F0A000"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EFF8"/>
    </linearGradient>
    <filter id="ballShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
    <filter id="cloudShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="2" flood-color="#00000022"/>
    </filter>
    <clipPath id="roundedRect">
      <rect width="192" height="192" rx="41" ry="41"/>
    </clipPath>
  </defs>

  <rect width="192" height="192" rx="41" ry="41" fill="url(#bg)"/>

  <g clip-path="url(#roundedRect)">
    <!-- SOLEIL -->
    <circle cx="124" cy="73" r="43" fill="url(#sunGrad)"/>

